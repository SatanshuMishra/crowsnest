[package]
name = "crowsnest"
version = "1.0.0"
description = "A fast, private, local-first match monitor for World of Warships."
authors = ["Satanshu Mishra"]
license = "MIT"
repository = "https://github.com/SatanshuMishra/crowsnest"
edition = "2024"
rust-version = "1.92"
publish = false

[lib]
name = "crowsnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
notify = "9"
notify-debouncer-full = "0.8"
roxmltree = "0.21"
regex = "1"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
