name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build installer
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    environment: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci --ignore-scripts
      - run: npm run tauri build
        env:
          CROWSNEST_WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and publish
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer
      - name: Sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${TAG#v}"
          installer="installer/Crowsnest_${version}_x64-setup.exe"
          test -f "$installer"
          npx tauri signer sign --app-version "$version" "$installer"
      - name: Write the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          name="Crowsnest_${version}_x64-setup.exe"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
          notes="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "installer/${name}.sig")" \
            --arg url "$url" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64-nsis": {signature: $signature, url: $url}, "windows-x86_64": {signature: $signature, url: $url}}}' \
            > latest.json
      - name: Attach the installer and manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="Crowsnest_${TAG#v}_x64-setup.exe"
          gh release upload "$TAG" "installer/${name}" "installer/${name}.sig" latest.json --repo "$GITHUB_REPOSITORY" --clobber
